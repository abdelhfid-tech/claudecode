# Tests du radar et du flux n8n, sans aucun appel réseau. Le dépôt est public : rien n'est
# collecté ni publié ici. La collecte tourne sur votre serveur (voir deploy/README.md).
name: radar-tests

on:
  push:
    paths: ["plugins/**", "deploy/**", ".github/workflows/radar-tests.yml"]
  pull_request:
    paths: ["plugins/**", "deploy/**"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests du radar
        run: |
          python -m pip install --quiet pytest
          cd plugins/radar-decalage && python -m pytest -q
      - name: Nœuds du flux n8n
        run: node deploy/n8n/test_nodes.mjs
      - name: Le flux n8n correspond à ses sources
        run: |
          python deploy/n8n/build.py
          git diff --exit-code deploy/n8n/radar-contenu-reactif.json
      - name: Scripts d'installation
        run: |
          bash -n deploy/hostinger/install.sh
          sh -n deploy/hostinger/radar-run
