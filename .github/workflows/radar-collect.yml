# Collecte planifiée du radar (code seul, sans IA).
#
# Un seul écrivain : ce workflow est le seul à écrire sur la branche de données
# « radar-data ». Les exécutions ne se chevauchent pas (groupe de concurrence).
#
# ACTIVATION, après décision sur la visibilité du dépôt :
#   1. fusionner ce fichier dans la branche par défaut (GitHub ne planifie que depuis elle) ;
#   2. décommenter le bloc « schedule » ;
#   3. lancer une première exécution à la main (onglet Actions, « Run workflow »).
# Contact pour l'agent utilisateur Wikimedia : variable de dépôt RADAR_CONTACT (facultative).

name: radar-collect

on:
  workflow_dispatch:
    inputs:
      cadence:
        description: "daily (toutes les sources) ou hourly (tendances du jour seulement)"
        required: true
        default: daily
        type: choice
        options: [daily, hourly]
  # schedule:
  #   - cron: "17 5 * * *"   # quotidien, 05:17 UTC
  #   - cron: "41 */2 * * *" # toutes les 2 heures, tendances du jour (quota de minutes en dépôt privé)

permissions:
  contents: write

concurrency:
  group: radar-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Récupérer la branche de données
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$REMOTE" radar-data >/dev/null 2>&1; then
            git clone --depth 1 --branch radar-data --single-branch "$REMOTE" workspace
          else
            mkdir workspace && cd workspace && git init -b radar-data && git remote add origin "$REMOTE"
          fi

      - name: Collecter
        env:
          RADAR_WORKSPACE: ${{ github.workspace }}/workspace
          RADAR_CONTACT: ${{ vars.RADAR_CONTACT }}
        run: |
          CADENCE="${{ github.event.inputs.cadence }}"
          if [ -z "$CADENCE" ]; then
            if [ "${{ github.event.schedule }}" = "41 */2 * * *" ]; then CADENCE=hourly; else CADENCE=daily; fi
          fi
          cd plugins/radar-decalage
          python -m radar collect --cadence "$CADENCE" || echo "certaines sources ont échoué : voir le journal d'exécution"
          python -m radar health

      - name: Écrire sur la branche de données
        run: |
          cd workspace
          git config user.name "radar-collect"
          git config user.email "radar-collect@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "rien de nouveau"; exit 0; fi
          git commit -q -m "collecte $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin radar-data
