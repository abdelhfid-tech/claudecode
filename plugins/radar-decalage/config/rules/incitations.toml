# 5. Règles produit, consommateur et données
[[dispositif]]
id = "ma_onssa_complements"
pays = "MA"
sens = "freine"
categorie = "reglementation"
s_applique_a = ["produit_importe", "colis_ecommerce"]
titre = "Aliments et compléments alimentaires importés : contrôle ONSSA, enregistrement préalable et réforme en cours"
resume = "La loi 28-07 soumet les produits alimentaires, importation comprise, au contrôle de l'ONSSA, dont la plateforme ATLAS (2024) enregistre les établissements étrangers fournisseurs de viandes, produits de la pêche, lait, jus et conserves. Les compléments alimentaires exigent un enregistrement préalable avant mise sur le marché, l'autorité compétente (ONSSA ou AMMPS) étant présentée différemment selon les sources en 2026 ; la presse cite des plafonds de dosage bas (vitamine D 10 µg, vitamine C 180 mg) et une étude privée estime 12 à 15 mois et 15 000 à 20 000 DH par produit. Une réforme de l'article 30 de la loi 17-04 réservant aux pharmacies certains compléments à effet thérapeutique a été adoptée en première lecture par la Chambre des représentants en juin 2026, sans adoption définitive confirmée."
pour_fes = "Importer des compléments américains ou des produits alimentaires de Dubaï pour les revendre à Fès est parmi les projets les plus freinés : environ un an de délai, un coût par référence et des formules souvent non conformes aux plafonds marocains."
as_of = 2026-11-28
date_regle = "Loi 28-07 ; ATLAS : juillet 2024 ; réforme de la loi 17-04 en cours (juin 2026)"
source = "https://fr.hespress.com/379444-379444.html ; https://fr.hespress.com/477181-complements-alimentaires-pourquoi-la-reforme-inquiete.html ; https://fr.le360.ma/economie/complements-alimentaires-un-secteur-a-3-milliards-freine-par-sa-reglementation_OUAZW2LHIFDYZOEBBQXVCPGHAU/"
preuve = "F2"

[[dispositif]]
id = "ma_cosmetiques_ammps"
pays = "MA"
sens = "freine"
categorie = "reglementation"
s_applique_a = ["produit_importe", "colis_ecommerce"]
titre = "Cosmétiques : déclaration d'établissement et enregistrement auprès de l'AMMPS"
resume = "Le guide de l'AMMPS (Agence marocaine du médicament et des produits de santé) rend obligatoire une déclaration préalable d'établissement avant toute fabrication ou commercialisation de cosmétiques, avec registre de commerce, plans des locaux (sous-sols interdits) et liste du personnel qualifié, l'enregistrement des produits relevant de la circulaire ministérielle n° 771 ; les coopératives peuvent fabriquer et exporter mais pas importer. Depuis le 31 mars 2026, la plateforme TARKHISS dématérialise déclarations d'activité, enregistrements, certificats de libre vente et autorisations d'importation de matières premières."
pour_fes = "Revendre des cosmétiques importés suppose une société inscrite au RC, un local conforme et un enregistrement par produit, ce qui cadre mal avec un statut d'auto-entrepreneur et un budget de 2 000 €."
