titre = "Micro-entreprise : plafonds 2026, cotisations en pourcentage du chiffre d'affaires et versement libératoire"
resume = "Plafonds 2026 : 203 100 € HT pour la vente de marchandises, 83 600 € pour les prestations de services et activités libérales. Cotisations sociales (fiche officielle vérifiée le 01/01/2026) : 12,3 % (vente), 21,2 % (prestations BIC), 25,6 % (libéral non réglementé), 23,2 % (Cipav). Versement libératoire de l'impôt possible (1 % vente, 1,7 % services BIC, 2,2 % BNC) si le revenu fiscal de référence N-2 est inférieur à 29 579 € pour une personne seule, à demander avant le 30 septembre pour l'année suivante ou, à la création, avant la fin du 3e mois suivant."
pour_projet = "C'est le statut le moins coûteux pour tester un import ou des services numériques avec moins de 2 000 € (cotisations seulement sur ce qui est encaissé), mais achats, frais de port et droits de douane ne sont pas déductibles, ce qui pénalise l'achat-revente à faible marge."
as_of = 2026-11-28
date_regle = "Plafonds 2026 (fiche vérifiée le 21/02/2026) ; taux (fiche vérifiée le 01/01/2026) ; versement libératoire (fiche vérifiée le 13/05/2026)"
source = "https://entreprendre.service-public.gouv.fr/vosdroits/F32353 ; https://entreprendre.service-public.gouv.fr/vosdroits/F36232 ; https://entreprendre.service-public.gouv.fr/vosdroits/F23267"
preuve = "F"

[[dispositif]]
id = "fr_franchise_base_tva"
pays = "FR"
sens = "facilite"
categorie = "fiscalite"
s_applique_a = ["produit_importe", "colis_ecommerce", "service_numerique", "artisanat"]
titre = "Franchise en base de TVA : seuils maintenus à 85 000 € (ventes) et 37 500 € (services), réforme à 25 000 € abandonnée"
resume = "Pas de TVA facturée tant que le chiffre d'affaires de l'année précédente ne dépasse pas 85 000 € pour les ventes (tolérance 93 500 € l'année en cours) et 37 500 € pour les services (tolérance 41 250 €), seuils proratisés l'année de création. Le seuil unique de 25 000 € de la loi de finances pour 2025 a été abandonné (loi n° 2025-1044 du 3 novembre 2025) et le seuil de 37 500 € pour tous proposé par le PLF 2026 n'apparaît pas dans le BOFiP du 1er juillet 2026, qui applique toujours 85 000 € et 37 500 €. Mention sur facture : « TVA non applicable, article 293 B du CGI »."
pour_projet = "La micro-entreprise vend sans TVA aux particuliers, mais ne récupère ni la TVA payée à l'importation (20 %) ni celle de ses achats, ce qui renchérit un stock importé de Chine ou du Maroc."
as_of = 2026-11-28
date_regle = "Loi n° 2025-1044 du 03/11/2025 ; BOFiP BOI-TVA-DECLA-40-10-10 du 01/07/2026"
source = "https://bofip.impots.gouv.fr/bofip/849-PGP.html/identifiant=BOI-TVA-DECLA-40-10-10-20260701"
preuve = "F"

