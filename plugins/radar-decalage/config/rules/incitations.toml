resume = "Le dispositif TPME (décret 2-25-342, activé par des décisions publiées au BO n° 7454 du 6 novembre 2025) subventionne des investissements de 1 à 50 MDH, avec au moins 10 % de fonds propres et un emploi stable par million investi ; les primes (emploi 5 à 10 %, territoriale 10 à 15 %, secteurs prioritaires 10 %) sont plafonnées à 30 % et versées après réalisation. Le CRI est le guichet (plateforme CRI-invest.ma), avec l'appui technique de Maroc PME."
