resume = "Tamwilcom affiche en 2026 « Damane Intelak », garantie couvrant jusqu'à 80 % du crédit bancaire, sans commission, ouverte aux entrepreneurs, auto-entrepreneurs et petites entreprises, avec une variante rurale. Fin mai 2026, Intelaka comptait environ 33 600 entreprises bénéficiaires et 8,2 Mds DH de crédits, mais il est jugé essoufflé et doit être intégré à la Charte TPE signée en décembre 2025 et en vigueur depuis le 1er janvier 2026 (engagement bancaire de 18 Mds DH par an). Les taux bonifiés et le plafond de prêt applicables fin 2026 n'ont pas pu être vérifiés (inconnus)."
pour_fes = "Un crédit garanti reste possible pour un auto-entrepreneur de Fès, mais la garantie réduit seulement le risque de la banque : c'est elle qui accepte ou refuse le dossier."
