resume = "Forsa, piloté par le ministère du Tourisme via la SMIT, a connu des éditions en 2022 et 2023 ; en 2026, la seule communication officielle trouvée porte sur le report d'un an des remboursements des prêts d'honneur, à demander avant le 28 février 2026, pour environ 21 000 porteurs éligibles. Aucun appel à candidatures 2024, 2025 ou 2026 n'a été trouvé, ni aucun texte officiel de clôture : je ne peux pas confirmer que le programme est clos, seulement qu'il ne semble plus ouvert aux nouveaux candidats."
