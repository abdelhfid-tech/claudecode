titre = "Facturation électronique : réception obligatoire depuis le 1er septembre 2026, émission pour les micro-entreprises au 1er septembre 2027"
resume = "Depuis le 1er septembre 2026, toutes les entreprises doivent pouvoir recevoir des factures électroniques via une plateforme agréée ; l'émission devient obligatoire le 1er septembre 2027 pour les PME et micro-entreprises. Les ventes aux particuliers et les opérations internationales ne passent pas par la facture électronique, mais leurs données doivent être transmises à l'administration (e-reporting)."
