[[dispositif]]
id = "ma_conformite_contrefacon"
pays = "MA"
sens = "freine"
categorie = "reglementation"
s_applique_a = ["produit_importe", "colis_ecommerce", "concept_franchise"]
titre = "Produits industriels : certificat de conformité obligatoire et saisie douanière des contrefaçons"
resume = "Depuis le 1er février 2020 (loi 24-09), de nombreux produits industriels importés (électroménager et produits électriques, jouets, textiles, chaussures, cuir, plastiques, articles au contact des aliments, équipements de protection, pièces auto) doivent avoir un certificat de conformité, délivré en principe dans le pays d'export par un organisme mandaté, sans seuil de valeur, avec marquage et notices en arabe et marquage CMIM pour l'électrique et les jouets. La loi 17-97 modifiée par la loi 23-13 (en vigueur le 18 décembre 2014) permet à la douane de suspendre des marchandises suspectées de contrefaçon, à la demande du titulaire de la marque ou d'office, le titulaire ayant 10 jours ouvrables pour saisir la justice ; seuls les petits envois personnels non commerciaux sont exclus."
pour_fes = "Un lot de jouets ou d'objets électriques sans certificat ni marquage arabe risque le blocage, et toute copie de marque peut être saisie ; à l'inverse, déposer sa marque à l'OMPIC permet de demander cette protection en douane pour un concept importé."
as_of = 2026-11-28
date_regle = "Contrôle de conformité : 2020-02-01 ; loi 23-13 : 2014-12-18"
source = "https://verigates.bureauveritas.com/sites/verigates/files/2020-01/MAROC%20(Voc)%20FR%20Datasheet%20Rev.1.pdf ; https://www.wipo.int/wipolex/fr/legislation/details/19767"
preuve = "F2"

[[dispositif]]
id = "ma_loi_31_08"
pays = "MA"
sens = "freine"
categorie = "reglementation"
s_applique_a = ["colis_ecommerce", "service_numerique", "produit_importe"]
titre = "Vente à distance (loi 31-08) : 7 jours de rétractation et informations obligatoires"
resume = "Le consommateur dispose de 7 jours pour se rétracter sans motif ni pénalité, hors frais de retour, délai porté à 30 jours si le fournisseur n'a pas confirmé par écrit les informations obligatoires ; le délai court à la réception du bien ou à l'acceptation de l'offre de service (art. 36). L'offre en ligne doit préciser notamment les caractéristiques, l'identité du vendeur, les frais et délais de livraison, le droit de rétractation et les modalités de paiement (art. 29), et un contrat en langue étrangère doit être accompagné d'une traduction en arabe (art. 206)."
pour_fes = "Une boutique en ligne basée à Fès doit accepter les retours sous 7 jours et publier des conditions de vente complètes, avec version arabe."
as_of = 2026-11-28
date_regle = "2011-04-07 (BO n° 5932)"
source = "https://www.wipo.int/wipolex/fr/legislation/details/19773 ; https://www.axl.cefan.ulaval.ca/afrique/maroc-loi-consommateur-2011.htm"
preuve = "F"

[[dispositif]]
id = "ma_cndp_09_08"
pays = "MA"
sens = "freine"
categorie = "reglementation"
s_applique_a = ["service_numerique", "colis_ecommerce"]
titre = "Service numérique : notification à la CNDP (loi 09-08) et transferts de données à l'étranger encadrés"
resume = "Tout traitement de données personnelles (fichier clients, newsletter, CRM) doit être notifié à la CNDP avant sa mise en œuvre, avec autorisation préalable pour les données sensibles et certains usages (art. 12). Les transferts à l'étranger ne sont libres que vers les pays jugés adéquats par la CNDP ; sinon il faut une autorisation ou une exception (consentement explicite, exécution du contrat), et un transfert illicite est passible de 3 mois à 1 an de prison et/ou 20 000 à 200 000 DH d'amende. Aucune loi de réforme n'était adoptée fin juin 2026, des projets d'alignement sur le RGPD étant en discussion."
pour_fes = "Un service numérique qui stocke les données de clients marocains sur des outils hébergés à l'étranger doit le déclarer à la CNDP et justifier le transfert ; ses clients français relèvent en plus du RGPD."
as_of = 2026-11-28
date_regle = "Loi 09-08 (BO du 2009-03-05) ; situation décrite au 2026-06-29"
source = "https://cms.law/en/int/expert-guides/cms-expert-guide-to-data-protection-and-cyber-security-laws/morocco ; https://www.cndp.ma/wp-content/uploads/2025/07/CNDP_Procedure-de-Notification-des-traitements_20250724.pdf"
preuve = "F2"
