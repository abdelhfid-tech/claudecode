# 1. Douane à l'importation
[[dispositif]]
id = "ma_di_droit_commun"
pays = "MA"
sens = "freine"
categorie = "douane"
s_applique_a = ["produit_importe", "colis_ecommerce"]
titre = "Droit d'importation de droit commun (pays sans accord) : 30 % le plus souvent pour les produits finis"
resume = "Sans accord préférentiel (cas de la Chine), un produit fini de consommation paie le droit commun : la LF 2024 a ramené de 40 % à 30 % tous les produits relevés à 40 % par la LFR 2020 (sauf chapitre 24 et produits déjà à 40 % avant 2020), et l'échelle courante reste 2,5 %, 10 %, 17,5 %, 30 % et 40 %. Des taux plus élevés existent pour des produits ciblés : safran 60 % depuis le 1er janvier 2026 (LF 2026), produits du cannabis 200 % (LF 2025) ; à l'inverse, les smartphones sont passés de 17,5 % à 2,5 % au 1er janvier 2026."
pour_fes = "Un produit fini acheté en Chine supporte en général 30 % de droit puis 20 % de TVA calculée droit inclus, soit environ 56 % de surcoût fiscal avant transitaire et transport."
as_of = 2026-11-28
date_regle = "2024-01-01 (LF 2024, 40 % ramené à 30 %) ; 2026-01-01 (LF 2026)"
source = "https://ecoactu.ma/wp-content/uploads/2024/01/Recueil_CIRCULAIRES_ADII_4eme_Trimestre_2023.pdf ; https://www.finances.gov.ma/Publication/adii/2025/circulaire_97273.pdf"
preuve = "F"

[[dispositif]]
id = "ma_tva_import"
pays = "MA"
sens = "freine"
categorie = "douane"
s_applique_a = ["produit_importe", "colis_ecommerce"]
titre = "TVA à l'importation : 20 % sur la valeur en douane majorée des droits"
resume = "La TVA à l'importation est de 20 % ad valorem (10 % pour une liste limitée : produits de l'article 99-B, huiles alimentaires fluides, maïs, orge, etc.), calculée sur la valeur en douane augmentée des droits d'entrée et taxes (art. 121 CGI). Elle est perçue par la douane au dédouanement, y compris sur les colis achetés en ligne."
pour_fes = "Un importateur assujetti récupère cette TVA par déduction ; pour un particulier ou un auto-entrepreneur non assujetti, c'est un coût définitif à intégrer au prix de revient."
as_of = 2026-11-28
date_regle = "Article 121 CGI, dernière modification LF 2024 (loi 55-23), texte vérifié dans l'édition 2026"
source = "https://ecoactu.ma/wp-content/uploads/2025/12/Code-general-des-impots-CGI-2026.pdf"
preuve = "F"

[[dispositif]]
id = "ma_colis_ecommerce"
pays = "MA"
sens = "freine"
categorie = "douane"
s_applique_a = ["colis_ecommerce", "produit_importe"]
titre = "Achats sur plateformes étrangères : aucune franchise, quel que soit le montant"
resume = "Depuis le 1er juillet 2022, les achats effectués via les plateformes internationales de e-commerce sont exclus de l'exonération de droits et taxes, quelle qu'en soit la valeur ; la franchise de 1 250 DH ne subsiste que pour les envois sans caractère commercial entre particuliers (décret 2-77-862, art. 190-e-2°). Les circulaires douanières des LF 2025 et LF 2026 ne contiennent aucune mesure nouvelle sur les petits colis, et aucune mesure e-commerce n'a été trouvée dans le PLF 2027 en discussion."
pour_fes = "Faire venir des échantillons par colis coûte droits et TVA dès le premier dirham, et fractionner des envois sous 1 250 DH est précisément la pratique ciblée par la douane."
as_of = 2026-11-28
date_regle = "2022-07-01"
source = "https://www.finances.gov.ma/CommuniquesEtAnnonces/adii/2022/Communiqu%C3%A9_AchatsEnligne_fr.pdf"
preuve = "F"

[[dispositif]]
id = "ma_ale_ue_usa"
pays = "MA"
sens = "facilite"
categorie = "douane"
s_applique_a = ["produit_importe"]
titre = "Accords avec l'UE et les États-Unis : droit zéro sur les produits industriels originaires"
resume = "Les produits industriels originaires de l'UE entrent à 0 % de droit d'importation depuis le 1er mars 2012 (accord d'association), la TVA restant due ; les produits agricoles ne sont que partiellement libéralisés. Avec les États-Unis (ALE en vigueur le 1er janvier 2006), plus de 95 % des échanges de produits de consommation et industriels sont devenus francs de droits immédiatement et le reste devait l'être en 9 ans, soit vers 2015 ; l'agriculture suit un calendrier plus long."
pour_fes = "Un produit fabriqué dans l'UE ou aux USA, et pas seulement expédié de là, évite les 30 % de droit commun, à condition d'obtenir du fournisseur la preuve d'origine prévue par l'accord."
as_of = 2026-11-28
date_regle = "UE : 2012-03-01 ; USA : 2006-01-01 (+9 ans)"
source = "https://lematin.ma/journal/2012/Demantelement-douanier_Les-produits-provenant-de-l-UE-rentreront--au-Maroc-a-droit-zero/163308.html ; https://ustr.gov/about-us/policy-offices/press-office/fact-sheets/archives/2004/march/free-trade-morocco-vital-step-towards-middle-e"
preuve = "F2"

[[dispositif]]
id = "ma_ale_eau_gzale"
pays = "MA"
sens = "facilite"
categorie = "douane"
s_applique_a = ["produit_importe"]
titre = "Accord Maroc–Émirats (2001) et zone arabe de libre-échange : exonération des produits d'origine émiratie"
resume = "L'accord de libre-échange Maroc–Émirats, signé le 25 juin 2001 et en vigueur depuis le 9 juillet 2003, s'adosse à la Grande zone arabe de libre-échange et prévoit une exonération totale et immédiate des produits originaires (sauf exclusions santé, sécurité, environnement), sous couvert du certificat d'origine arabe ; les produits d'origine nationale fabriqués en zone franche et exportés directement bénéficient aussi des préférences arabes (art. 6). Des droits antidumping visent toutefois certains produits émiratis (fils galvanisés : 18,44 % à 52,71 %, mesure définitive annoncée en septembre 2026)."
pour_fes = "Un produit chinois simplement réexpédié depuis Dubaï n'est pas émirati et paie le droit commun ; seul un produit fabriqué ou suffisamment transformé aux Émirats, avec certificat d'origine arabe, entre sans droit."
as_of = 2026-11-28
date_regle = "2003-07-09"
source = "https://rtais.wto.org/rtadocs/665/TOA/French/ACR_EAU_Maroc.pdf ; https://www.ires.ma/wp-content/uploads/2013/05/presentation_dg_ces_23_mai_2013_version_site_web-771.pdf"
preuve = "F2"

[[dispositif]]
id = "ma_ale_turquie"
pays = "MA"
sens = "facilite"
categorie = "douane"
s_applique_a = ["produit_importe"]
titre = "Accord Maroc–Turquie : franchise générale, mais plus de 1 200 produits retaxés à 90 % du droit commun"
resume = "L'ALE Maroc–Turquie (en vigueur depuis 2006) a été amendé par la loi 54-20 : depuis le 13 mai 2021, une liste négative de plus de 1 200 produits (630 positions tarifaires, notamment textile, habillement et cuir) paie 90 % du droit commun, pour 5 ans renouvelables une fois. La période initiale arrivait à échéance en mai 2026 ; aucune source trouvée ne confirme son renouvellement ou un nouvel avenant."
pour_fes = "Pour du textile ou de la maroquinerie turcs de la liste, compter environ 27 % de droit si le droit commun est de 30 % ; les autres produits industriels d'origine turque restent en principe à droit nul."
as_of = 2026-11-28
date_regle = "2021-05-13 (avenant, loi 54-20)"
source = "https://fr.le360.ma/economie/officiel-entree-en-vigueur-de-la-loi-amendant-lale-maroc-turquie-238527/ ; https://www.bladi.net/maroc-freine-produits-turcs-ankara-vend,123376.html"
preuve = "F2"

[[dispositif]]
id = "ma_chine"
pays = "MA"
sens = "freine"
categorie = "douane"
s_applique_a = ["produit_importe", "colis_ecommerce", "export_depuis_maroc"]
titre = "Maroc–Chine : pas d'accord tarifaire, des droits antidumping ciblés, mais un accès à droit zéro au marché chinois depuis mai 2026"
resume = "Aucun accord de libre-échange Maroc–Chine n'a été trouvé : les biens de consommation chinois paient le droit commun et la TVA, et certains subissent des droits antidumping (contreplaqué 76 % à compter du 25 septembre 2026). En sens inverse, la Chine accorde du 1er mai 2026 au 30 avril 2028 un traitement à droit zéro aux 20 pays africains non-PMA ayant des relations diplomatiques avec elle (hors droits hors contingent), et la presse marocaine indique que le Maroc en fait partie."
pour_fes = "Importer de Chine reste la voie la plus taxée ; à l'inverse, un produit d'origine marocaine fabriqué à Fès peut entrer en Chine sans droit jusqu'en avril 2028, sous réserve des règles d'origine chinoises."
as_of = 2026-11-28
date_regle = "Chine : 2026-05-01 au 2028-04-30 ; antidumping contreplaqué : 2026-09-25"
source = "https://english.www.gov.cn/news/202604/28/content_WS69f0a1d7c6d00ca5f9a0aad0.html ; https://fr.le360.ma/economie/maroc-chine-comment-tirer-profit-de-la-suppression-des-droits-de-douane_7K2L4MW4NRC4FBCHIM5TUVPGPY/ ; https://lematin.ma/economie/importations-droits-antidumping-de-76-sur-le-contreplaque-chinois/366885"
preuve = "F2"

# 2. Exportation depuis le Maroc
[[dispositif]]
id = "ma_tva_export"
pays = "MA"
sens = "facilite"
categorie = "fiscalite"
s_applique_a = ["export_depuis_maroc", "service_numerique", "artisanat"]
titre = "Exportations de biens et de services : TVA exonérée avec droit à déduction"
resume = "Les produits livrés et services rendus à l'exportation par les assujettis sont exonérés de TVA avec droit à déduction (art. 92-I-1° CGI) ; un service est exporté s'il est exploité ou utilisé hors du Maroc, ce qui se justifie par une facture au nom du client étranger et la preuve d'un règlement en devises. Les exportateurs peuvent aussi acheter en suspension de TVA dans la limite du chiffre d'affaires export de l'année précédente (art. 94)."
pour_fes = "Facturer un client en France pour un site web, un design ou un lot d'artisanat se fait sans TVA marocaine, à condition d'être payé en devises et de garder les justificatifs bancaires."
as_of = 2026-11-28
date_regle = "Articles 92-I-1° et 94 CGI, texte vérifié dans l'édition 2026"
source = "https://ecoactu.ma/wp-content/uploads/2025/12/Code-general-des-impots-CGI-2026.pdf"
preuve = "F"

[[dispositif]]
id = "ma_change_igoc2026"
pays = "MA"
sens = "facilite"
categorie = "reglementation"
s_applique_a = ["export_depuis_maroc", "service_numerique", "colis_ecommerce", "concept_franchise"]
titre = "Change (IGOC 2026) : rapatriement obligatoire, compte en devises possible, dotation e-commerce relevée"
resume = "Depuis le 1er janvier 2026, l'exportateur de services rapatrie ses recettes sous 90 jours (150 jours pour les biens) et peut en garder jusqu'à 70 % en compte devises ou dirhams convertibles ; ce compte exportateur est réservé aux inscrits au registre du commerce, mais un Marocain résident non inscrit au RC qui a des revenus de source étrangère peut ouvrir un compte en devises crédité jusqu'à 70 % (art. 234). La dotation e-commerce passe à 20 000 DH par an pour les particuliers et à 50 000 DH minimum pour les sociétés nouvellement créées (services achetés en ligne), et la définition des importations de services est élargie. Les redevances versées à un franchiseur étranger supportent une retenue à la source de 10 % (art. 15 et 19-IV-B CGI)."
pour_fes = "Un auto-entrepreneur de Fès payé en euros peut garder une partie de ses recettes en devises pour régler ses abonnements en ligne, et une SARL AU débutante dispose d'au moins 50 000 DH par an de paiements par carte à l'étranger pour ses services."
as_of = 2026-11-28
date_regle = "2026-01-01 (IGOC 2026)"
source = "https://www.oc.gov.ma/sites/default/files/2026-01/IGOC%202026_1.pdf ; https://ecoactu.ma/wp-content/uploads/2025/12/Code-general-des-impots-CGI-2026.pdf"
preuve = "F"

[[dispositif]]
id = "ma_export_ue_origine"
pays = "MA"
sens = "facilite"
categorie = "douane"
s_applique_a = ["export_depuis_maroc", "artisanat"]
titre = "Vente vers la France : l'origine marocaine prouvée évite les droits, y compris le nouveau droit européen de 3 € par article"
resume = "Dans la convention pan-euro-méditerranéenne, l'origine se prouve par un EUR.1 visé par la douane ou par une déclaration d'origine sur facture, ouverte à tout exportateur jusqu'à 6 000 € par envoi ; les petits colis jusqu'à 500 € et les bagages jusqu'à 1 200 € sont dispensés de preuve. Depuis le 1er juillet 2026 et jusqu'au 1er juillet 2028, l'UE applique 3 € par article (ligne tarifaire) aux envois B2C de 150 € ou moins, mais en exclut les marchandises sous accord préférentiel si la TVA n'est pas perçue via l'IOSS et si elles sont déclarées en H1. Côté marocain, toute exportation exige un numéro de RC ou, à défaut, un code particulier attribué par la douane."
pour_fes = "Un tapis ou un sac en cuir de Fès vendu à un particulier français peut échapper au droit de 3 € s'il voyage avec sa preuve d'origine hors IOSS, mais la TVA française reste due et il faut un RC ou un code douanier pour exporter."
as_of = 2026-11-28
date_regle = "Droit UE de 3 € : 2026-07-01 au 2028-07-01 ; règles PEM en vigueur"
source = "https://trade.ec.europa.eu/access-to-markets/fr/content/regles-dorigine-de-la-convention-paneuro-mediterraneenne ; https://taxation-customs.ec.europa.eu/news/guidance-and-legal-text-temporary-flat-fee-low-value-imports-which-will-apply-until-1-july-2028-2026-06-08_en ; https://mtaess.gov.ma/wp-content/uploads/2022/06/Guide-de-lexportateur-de-lArtisanat.pdf"
preuve = "F"

# 3. Statuts et fiscalité des petits entrepreneurs
[[dispositif]]
id = "ma_ae_regime"
pays = "MA"
sens = "facilite"
categorie = "statut"
s_applique_a = ["service_numerique", "artisanat", "colis_ecommerce"]
titre = "Auto-entrepreneur : impôt de 0,5 % ou 1 % du chiffre d'affaires, retenue de 30 % au-delà de 80 000 DH par client"
resume = "L'auto-entrepreneur paie l'IR à 0,5 % du chiffre d'affaires encaissé pour les activités commerciales, industrielles et artisanales (plafond 500 000 DH) et à 1 % pour les services (plafond 200 000 DH), plus un droit complémentaire selon un barème, avec adhésion obligatoire à la sécurité sociale (art. 42 bis, 42 ter, 73-III CGI). La retenue à la source de 30 % est toujours en vigueur dans le CGI 2026 : au-delà de 80 000 DH de services facturés à un même client sur l'année, le surplus est retenu à 30 % par ce client."
pour_fes = "Pour des services numériques vendus à un ou deux gros clients marocains, la retenue de 30 % au-delà de 80 000 DH par client annule l'intérêt du statut ; avec des clients nombreux, le coût reste proche de 1 % (le texte ne dit pas comment s'applique la retenue à un client étranger)."
as_of = 2026-11-28
date_regle = "Taux : LF 2019 ; retenue de 30 % : LF 2023 ; droit complémentaire : LF 2021 ; vérifié dans le CGI 2026"
source = "https://ecoactu.ma/wp-content/uploads/2025/12/Code-general-des-impots-CGI-2026.pdf"
preuve = "F"

[[dispositif]]
id = "ma_exclusion_importateur"
pays = "MA"
sens = "freine"
categorie = "statut"
s_applique_a = ["produit_importe", "export_depuis_maroc", "service_numerique"]
titre = "Marchands importateurs et exportateurs exclus de l'auto-entrepreneur et de la CPU"
resume = "Le décret 2-15-263 (2015) exclut du régime fiscal de l'auto-entrepreneur notamment les « marchands importateurs », « marchands exportateurs », commissionnaires en marchandises et mandataires négociants, et le décret 2-08-124 (2009) exclut les mêmes professions de la contribution professionnelle unique (CPU), régime qui taxe à 10 % un revenu égal au chiffre d'affaires multiplié par un coefficient (12 % pour les autres produits non alimentaires, 20 % pour les autres prestations ; plafonds 2 MDH et 500 000 DH). En revanche, la liste des activités ouvertes à l'auto-entrepreneur comprend la vente par Internet, la vente par correspondance, le conseil, hébergement et développement informatique et le design graphique."
pour_fes = "Importer soi-même pour revendre suppose en pratique une SARL (AU) ou un régime au réel ; un auto-entrepreneur peut vendre en ligne et facturer des services numériques, mais pas exercer comme marchand importateur ou exportateur."
as_of = 2026-11-28
date_regle = "Décret 2-08-124 du 28 mai 2009 ; décret 2-15-263 du 10 avril 2015 (textes annexés au CGI 2026)"
source = "https://ecoactu.ma/wp-content/uploads/2025/12/Code-general-des-impots-CGI-2026.pdf"
preuve = "F"

[[dispositif]]
id = "ma_societe_is"
pays = "MA"
sens = "freine"
categorie = "fiscalite"
s_applique_a = ["produit_importe", "service_numerique", "concept_franchise", "export_depuis_maroc"]
titre = "SARL et SARL AU : IS à 20 % dès le premier dirham en 2026, et plus d'exonération export"
resume = "Pour les exercices ouverts à partir du 1er janvier 2026, l'IS est de 20 % pour les bénéfices inférieurs à 100 MDH (contre 10 % jusqu'à 300 000 DH de bénéfice avant 2023) et 35 % au-delà ; la cotisation minimale est de 0,25 % du chiffre d'affaires, avec un minimum de 3 000 DH, mais les sociétés en sont exonérées pendant leurs 36 premiers mois d'exploitation. L'exonération quinquennale d'IS des exportateurs ne vaut plus que pour ceux dont la première exportation est antérieure au 1er janvier 2020 (LF 2020), et le capital d'une SARL est librement fixé depuis la loi 24-10."
pour_fes = "Une SARL AU se crée sans capital minimum, donc avec moins de 2 000 €, mais un petit bénéfice y est taxé à 20 % sans avantage pour l'export, contre 0,5 % à 1 % du chiffre d'affaires en auto-entrepreneur."
as_of = 2026-11-28
date_regle = "2026-01-01 (fin de la convergence des taux d'IS, LF 2023) ; LF 2020 pour l'export"
source = "https://ecoactu.ma/wp-content/uploads/2025/12/Code-general-des-impots-CGI-2026.pdf ; https://maroclaw.com/el-alami-souha-le-mirage-de-la-responsabilite-limitee-des-associes-de-la-sarl/"
preuve = "F"

[[dispositif]]
id = "ma_tva_revente_avance_import"
pays = "MA"
sens = "freine"
categorie = "fiscalite"
s_applique_a = ["produit_importe", "artisanat", "service_numerique"]
titre = "Importateur-revendeur : TVA obligatoire à la revente, et avance d'impôt de 3 % à l'import en projet (PLF 2027)"
resume = "La revente en l'état de produits importés par un commerçant importateur est obligatoirement soumise à la TVA, quel que soit le chiffre d'affaires (art. 89-I-3° CGI), alors que les fabricants et prestataires personnes physiques jusqu'à 500 000 DH de chiffre d'affaires en sont exonérés (art. 91-II-3°), de même que les tapis artisanaux de production locale (art. 91-I-C-4°). Le PLF 2027 prévoit une avance d'impôt perçue au dédouanement sur les marchandises importées pour revente en l'état, imputable sur l'IS ou l'IR : 5 % de la valeur en douane pendant 60 mois dans le projet, ramenés à 3 % et 36 mois par un amendement adopté en commission le 11 novembre 2026, avec une application prévue au 1er juillet 2027, texte non encore définitivement adopté."
pour_fes = "Un petit importateur doit gérer la TVA dès la première vente et, si la mesure est votée, avancer 3 % de la valeur de chaque lot pendant trois ans, alors qu'un artisan ou un prestataire de Fès sous 500 000 DH reste hors TVA."
as_of = 2026-11-28
date_regle = "CGI 2026 (art. 89 et 91) ; PLF 2027 : application prévue le 2027-07-01"
source = "https://ecoactu.ma/wp-content/uploads/2025/12/Code-general-des-impots-CGI-2026.pdf ; https://fr.le360.ma/economie/importations-lavance-fiscale-ramenee-de-5-a-3-et-limitee-a-trois-ans_FBATYTAUWRCURNEPCXJYBG7Y4I/ ; https://lematin.ma/economie/plf-2027-voici-les-principales-dispositions-fiscales-et-douanieres/371991"
preuve = "F2"

