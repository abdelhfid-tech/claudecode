[[dispositif]]
id = "fr_acre"
pays = "FR"
sens = "facilite"
categorie = "aide"
s_applique_a = ["produit_importe", "colis_ecommerce", "service_numerique", "artisanat", "concept_franchise"]
titre = "ACRE : exonération partielle de cotisations au démarrage, réduite à 25 % pour les micro-entreprises créées depuis le 1er juillet 2026"
resume = "Pour les micro-entreprises créées ou reprises depuis le 1er juillet 2026, l'exonération passe de 50 % à 25 % (taux égal à 75 % du taux normal, par exemple 15,9 % au lieu de 21,2 % en prestations BIC), jusqu'à la fin du 3e trimestre civil suivant le début d'activité (décret n° 2026-69 du 6 février 2026, pris pour l'article 23 de la LFSS 2026). Depuis le 1er janvier 2026, l'ACRE n'est plus automatique : demande à l'Urssaf dans les 60 jours du début d'activité, réservée à certains publics (demandeurs d'emploi, bénéficiaires du RSA ou de l'ASS, 18-25 ans, moins de 30 ans sans ARE, créateurs en QPV ou en ZFRR, etc.) n'en ayant pas bénéficié depuis 3 ans."
pour_projet = "Le gain devient modeste (environ 3 points de cotisations sur la vente de marchandises), suppose d'appartenir à un public éligible et d'écrire à l'Urssaf dans les 60 jours, mais l'ACRE reste indispensable pour un demandeur d'emploi qui veut l'ARCE."
as_of = 2026-11-28
date_regle = "Demande obligatoire depuis le 01/01/2026 ; 25 % pour les micro-entreprises créées depuis le 01/07/2026 (décret n° 2026-69 du 06/02/2026) ; fiche vérifiée le 01/07/2026"
source = "https://entreprendre.service-public.gouv.fr/vosdroits/F11677 ; https://entreprendre.service-public.gouv.fr/actualites/A18795"
preuve = "F"

[[dispositif]]
id = "fr_arce"
pays = "FR"
sens = "facilite"
categorie = "aide"
s_applique_a = ["produit_importe", "colis_ecommerce", "service_numerique", "artisanat", "concept_franchise"]
titre = "ARCE : 60 % des droits au chômage restants versés en capital au demandeur d'emploi qui crée"
resume = "Un demandeur d'emploi indemnisé qui crée son entreprise et obtient l'ACRE peut recevoir 60 % de ses droits ARE restants (moins 3 % pour la retraite complémentaire), en deux fois : la moitié au début d'activité, le reste 6 mois plus tard si l'activité continue et qu'il n'occupe pas un CDI à temps plein. L'alternative est de garder l'ARE mensuelle cumulée avec les revenus de l'activité ; l'ARCE ne valide pas de trimestres de retraite."
pour_projet = "Pour un porteur de projet au chômage, l'ARCE peut transformer des mois d'allocations en capital de départ (stock, site, échantillons) bien supérieur aux 2 000 € disponibles, tandis que le maintien de l'ARE protège mieux si les premières ventes tardent."
as_of = 2026-11-28
date_regle = "Fiche vérifiée le 13/08/2026 (convention d'assurance chômage du 15/11/2024, avenant n° 2 du 10/04/2026)"
source = "https://entreprendre.service-public.gouv.fr/vosdroits/F15252"
preuve = "F"

[[dispositif]]
id = "fr_pret_honneur"
pays = "FR"
sens = "facilite"
categorie = "aide"
s_applique_a = ["produit_importe", "colis_ecommerce", "service_numerique", "artisanat", "concept_franchise"]
titre = "Prêt d'honneur à taux zéro (Initiative France ; Réseau Entreprendre pour les projets créateurs d'emplois)"
resume = "Initiative France accorde des prêts personnels de 3 000 à 50 000 € (10 000 € en moyenne), à 0 % et sans garantie, après un comité d'agrément, avec un accompagnement ; en moyenne les banques prêtent 9,5 € pour 1 € de prêt d'honneur. Réseau Entreprendre prête de 15 000 à 90 000 € selon les antennes, mais vise des projets créant environ 5 emplois à 3 ans avec un apport d'environ 15 000 €."
pour_projet = "Un prêt d'honneur Initiative de quelques milliers d'euros est réaliste pour financer un premier stock ou un site avec un business plan solide ; Réseau Entreprendre ne correspond pas à un entrepreneur seul à 10-15 h par semaine."
as_of = 2026-11-28
date_regle = "Conditions publiées consultées le 28/11/2026 (pas de texte réglementaire)"
source = "https://www.initiative-france.fr/nos-solutions/financement-le-pret-d-honneur.html ; https://www.reseau-entreprendre.org/aquitaine/entreprendre/"
preuve = "F"

[[dispositif]]
id = "fr_bourse_french_tech"
pays = "FR"
sens = "facilite"
categorie = "aide"
s_applique_a = ["service_numerique"]
titre = "Bourse French Tech (Bpifrance) : subvention pour projet innovant, peu adaptée à l'import-revente"
resume = "Subvention de 30 000 € au maximum couvrant jusqu'à 50 % des dépenses éligibles (jusqu'à 70 % selon la catégorie d'entreprise), pour une entreprise immatriculée en France depuis moins d'un an, de moins de 50 salariés, portant un projet innovant ; aucune dépense engagée avant la demande n'est retenue, programme de 24 mois au plus, versement en deux tranches. La variante Emergence (deeptech) va jusqu'à 90 000 €."
pour_projet = "Importer un produit ou un concept existant n'est en général pas un projet innovant : la Bourse French Tech, comme le crédit d'impôt innovation ou le statut JEI (non vérifiés ici), n'est réaliste que pour un service numérique réellement original porté par une société française."
as_of = 2026-11-28
date_regle = "Fiche catalogue Bpifrance lue en extrait (date de mise à jour non affichée)"
source = "https://www.bpifrance.fr/catalogue-offres/bourse-french-tech"
preuve = "F2"

[[dispositif]]
id = "fr_zones_zfrr_qpv"
pays = "FR"
sens = "facilite"
categorie = "zone"
s_applique_a = ["produit_importe", "colis_ecommerce", "service_numerique", "artisanat"]
titre = "Zones aidées : ZFRR, ZFRR+ et nouvelle exonération en quartier prioritaire ; fin des ZFU-TE"
resume = "En zone France Ruralités Revitalisation (créations du 1er juillet 2024 au 31 décembre 2029) : exonération d'impôt sur les bénéfices totale 5 ans puis dégressive 3 ans, pour moins de 11 salariés, mais réservée au régime réel (micro-fiscal exclu) ; en ZFRR+ (créations 2025-2029), le régime micro est admis. En QPV, la loi de finances pour 2026 crée une exonération d'impôt sur les bénéfices (5 ans à taux plein puis 60 %, 40 %, 20 %) pour les activités commerciales, artisanales ou de santé de moins de 50 salariés implantées du 1er janvier 2026 au 31 décembre 2030, tandis que les ZFU-TE n'accueillent plus de nouvelles entreprises depuis le 1er janvier 2026."
pour_projet = "Une implantation réelle en ZFRR+ ou en QPV ouvre aussi l'accès à l'ACRE et peut exonérer les bénéfices, mais une micro-entreprise en ZFRR simple n'a pas droit à l'exonération et l'activité doit être exercée dans la zone (au plus 25 % du chiffre d'affaires hors zone en ZFRR)."
as_of = 2026-11-28
date_regle = "ZFRR : 01/07/2024-31/12/2029 ; ZFRR+ : 01/01/2025-31/12/2029 ; QPV : 01/01/2026-31/12/2030 (loi n° 2026-103 du 19/02/2026) ; fiche ZFRR vérifiée le 21/02/2026 ; page QPV modifiée le 03/03/2026"
source = "https://entreprendre.service-public.gouv.fr/vosdroits/F31139 ; https://www.collectivites-locales.gouv.fr/actualites/une-nouvelle-fiscalite-pour-soutenir-lactivite-economique-dans-les-quartiers-prioritaires-de-la"
preuve = "F"

[[dispositif]]
id = "eu_tva_services_numeriques"
pays = "UE"
sens = "freine"
categorie = "fiscalite"
s_applique_a = ["service_numerique", "export_depuis_maroc"]
titre = "Services numériques vendus depuis le Maroc : TVA française dès le premier euro aux particuliers, autoliquidation par les clients professionnels"
resume = "Un prestataire établi hors UE qui fournit des services électroniques à des particuliers en France doit appliquer la TVA française (20 %) dès le premier euro, le seuil de 10 000 € ne s'appliquant pas aux opérateurs établis hors UE ; il peut s'inscrire au régime non-UE du guichet unique dans un seul État et déclarer chaque trimestre (au plus tard les 30 avril, 31 juillet, 31 octobre et 31 janvier). Pour un client professionnel assujetti en France, c'est le client qui acquitte la TVA (article 283, 2 du CGI) et la facture est émise hors taxe avec mention de l'autoliquidation."
pour_projet = "Facturer depuis une structure marocaine est simple avec des entreprises clientes (autoliquidation) mais impose une inscription OSS et 20 % de TVA avec des particuliers ; facturer via une micro-entreprise française en franchise évite la TVA jusqu'à 37 500 € de services."
as_of = 2026-11-28
date_regle = "Guichet unique depuis le 01/07/2021 ; article 283, 2 du CGI en vigueur au 28/11/2026, abrogé au 01/01/2027 dans le cadre du transfert des règles TVA vers le code des impositions sur les biens et services"
source = "https://www.impots.gouv.fr/professionnel/suis-je-concerne-0 ; https://vat-one-stop-shop.ec.europa.eu/one-stop-shop/declare-and-pay-oss_en ; https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000051214570"
preuve = "F"

[[dispositif]]
id = "eu_rgpd_prestataire_hors_ue"
pays = "UE"
sens = "freine"
categorie = "reglementation"
s_applique_a = ["service_numerique", "export_depuis_maroc"]
titre = "RGPD : représentant dans l'UE pour un prestataire marocain et transferts vers le Maroc à encadrer (pas de décision d'adéquation)"
resume = "Le RGPD s'applique à un prestataire établi hors UE qui cible des personnes en France (article 3, paragraphe 2) ; il doit alors désigner par écrit un représentant établi dans l'UE (article 27), sauf traitement occasionnel, sans données sensibles à grande échelle et peu susceptible de créer un risque. Le Maroc ne figure pas parmi les 16 pays et territoires bénéficiant d'une décision d'adéquation de la Commission : les transferts de données personnelles de l'UE vers le Maroc doivent reposer sur des garanties appropriées, par exemple des clauses contractuelles types."
pour_projet = "Si des fichiers clients français sont traités ou hébergés depuis Fès, il faut des clauses contractuelles types entre l'entité française (ou le client) et l'entité marocaine, et un représentant RGPD si l'on facture depuis le Maroc sans établissement dans l'UE."
as_of = 2026-11-28
date_regle = "RGPD applicable depuis le 25/05/2018 ; liste d'adéquation consultée le 28/11/2026 (dernière actualité de la page : 16/11/2026)"
source = "https://commission.europa.eu/law/law-topic/data-protection/international-dimension-data-protection/adequacy-decisions_en ; https://www.cnil.fr/fr/reglement-europeen-protection-donnees/chapitre4"
preuve = "F"

[[dispositif]]
id = "fr_complements_alimentaires"
pays = "FR"
sens = "freine"
categorie = "reglementation"
s_applique_a = ["produit_importe", "colis_ecommerce", "export_depuis_maroc"]
titre = "Compléments alimentaires : déclaration préalable sur Compl'Alim et composition encadrée"
resume = "Avant d'importer et de vendre un complément alimentaire en France, il faut le déclarer en ligne sur Compl'Alim (décret n° 2006-352 du 20 mars 2006) ; seuls les nutriments et plantes autorisés (arrêtés du 9 mai 2006 et du 24 juin 2014) sont admis et l'étiquetage est réglementé ; ce sont des marchandises soumises à restriction, contrôlées à l'importation. Compl'Alim a remplacé TéléIcare en septembre 2025 ; data.gouv indique une gestion par la DGAL, la douane citant encore la DGCCRF."
pour_projet = "Revendre en France des gélules à base de plantes trouvées aux USA, à Dubaï ou au Maroc impose de vérifier chaque ingrédient avant la déclaration : un produit vendu légalement à l'étranger peut ne pas être conforme en France."
as_of = 2026-11-28
date_regle = "Décret n° 2006-352 du 20/03/2006 ; Compl'Alim depuis septembre 2025"
source = "https://www.douane.gouv.fr/demarche/importer-des-complements-alimentaires ; https://www.data.gouv.fr/datasets/declarations-de-complements-alimentaires/informations"
preuve = "F"

[[dispositif]]
id = "eu_cosmetiques"
pays = "UE"
sens = "freine"
categorie = "reglementation"
s_applique_a = ["produit_importe", "colis_ecommerce", "export_depuis_maroc", "artisanat"]
titre = "Cosmétiques : personne responsable dans l'UE, rapport de sécurité et notification CPNP avant la vente"
resume = "Selon le règlement (CE) n° 1223/2009, un cosmétique ne peut être mis sur le marché que si une personne responsable est désignée dans l'UE ; un rapport sur la sécurité du produit doit exister avant la mise sur le marché et le produit est notifié une fois sur le portail européen CPNP. L'importateur est en pratique la personne responsable et tient le dossier d'information produit à disposition ; en France, la DGCCRF contrôle seule depuis 2024 et l'absence de notification CPNP est punie de 2 ans de prison et 30 000 € d'amende (article L5431-2 du code de la santé publique)."
pour_projet = "Huile d'argan, savon noir, ghassoul ou cosmétiques achetés à Dubaï ne peuvent être revendus en France qu'avec un rapport de sécurité et une notification CPNP, coût fixe par produit à comparer à un capital de 2 000 €."
as_of = 2026-11-28
date_regle = "Règlement (CE) n° 1223/2009 ; contrôle exclusif de la DGCCRF depuis 2024"
source = "https://single-market-economy.ec.europa.eu/sectors/cosmetics/legislation_en ; https://www.economie.gouv.fr/files/files/directions_services/dgccrf/documentation/publications/Guide/2024/je-lance-mon-entreprise-de-cosmetiques.pdf"
preuve = "F"

[[dispositif]]
id = "eu_denrees_import_controles"
pays = "UE"
sens = "freine"
categorie = "reglementation"
s_applique_a = ["produit_importe", "export_depuis_maroc"]
titre = "Denrées alimentaires importées : contrôle vétérinaire obligatoire et contrôles renforcés pour certaines denrées végétales"
resume = "Les produits d'origine animale venant de pays tiers doivent provenir d'un pays et d'un établissement autorisés par l'UE, être accompagnés d'un certificat officiel et passer un contrôle vétérinaire en poste de contrôle frontalier (SIVEP, rattaché à la DGAL), avec pré-notification dans TRACES-NT au moins un jour ouvrable avant l'arrivée et une redevance à la charge de l'importateur. Les denrées végétales soumises à contrôles renforcés ou à mesures d'urgence exigent aussi un DSCE-D, dont la référence doit figurer sur la déclaration en douane."
pour_projet = "Importer de Fès du miel, de la viande ou des produits laitiers suppose un établissement marocain agréé par l'UE, un certificat sanitaire et un passage en poste de contrôle, ce qui pèse lourd pour un petit projet ; épices, dattes ou huiles végétales doivent être vérifiées au cas par cas."
as_of = 2026-11-28
date_regle = "Pages douane consultées le 28/11/2026 (sans date de mise à jour affichée)"
source = "https://www.douane.gouv.fr/demarche/importer-des-marchandises-soumises-reglementation-veterinaire ; https://www.douane.gouv.fr/professionnels/commerce-international/controles-sanitaires-et-de-qualite-des-aliments/vous-importez"
preuve = "F"

[[dispositif]]
id = "eu_materiaux_contact_ceramique"
pays = "UE"
sens = "freine"
categorie = "reglementation"
s_applique_a = ["artisanat", "export_depuis_maroc", "produit_importe"]
titre = "Céramiques au contact des aliments (tajines, plats, tasses) : limites de plomb et de cadmium et déclaration de conformité"
resume = "Les matériaux et objets destinés au contact des denrées relèvent du règlement (CE) n° 1935/2004 et, en France, du décret n° 2007-766 du 10 mai 2007 et d'arrêtés ministériels. Pour les céramiques, des quantités maximales de plomb et de cadmium cédées aux aliments s'appliquent et une déclaration écrite de conformité doit accompagner les objets, avec une documentation tenue à la disposition des contrôleurs ; la DGCCRF a déjà analysé des plats à tajine et signale que les céramiques peuvent libérer plomb ou cadmium."
pour_projet = "Un tajine ou une vaisselle de Fès vendu pour un usage alimentaire doit être testé (migration du plomb et du cadmium) et accompagné d'une déclaration de conformité du fabricant ; sinon sa vente comme ustensile de cuisine n'est pas conforme."
as_of = 2026-11-28
date_regle = "Règlement (CE) n° 1935/2004 ; page ministérielle publiée le 15/04/2024 ; arrêté de 1985 modifié le 23/05/2006 (copie FAOLEX)"
source = "https://www.entreprises.gouv.fr/fr/echanges-commerciaux-et-reglementation/libre-circulation-des-produits/materiaux-au-contact-de-denrees-alimentaires ; https://faolex.fao.org/docs/pdf/fra64422.pdf"
preuve = "F2"

