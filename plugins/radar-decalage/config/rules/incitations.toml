# Aides et freins à l'arrivée d'un produit, d'un service ou d'un concept au Maroc ou en France.
# Chaque dispositif est daté et sourcé ; preuve F = source officielle lue, F2 = presse ou cabinet citant
# la source officielle, H = non confirmé. Relire après chaque loi de finances (Maroc, France) et chaque
# règlement européen. Contrôle : python -m radar rules

# ---------- France et Union européenne (recherche du 28/11/2026, 25 dispositifs) ----------
# Incertitudes relevées : frais de 2 € (par catégorie ou par article), sortie du droit de 3 € pour les marchandises
# d'origine marocaine sous preuve d'origine (non confirmée pour l'IOSS), taux 2026 de la micro-entreprise à revérifier
# sur urssaf.fr, publics de l'ACRE, double résidence France–Maroc (convention fiscale) non examinée.

[[dispositif]]
id = "eu_tarif_douanier_commun"
pays = "UE"
sens = "freine"
categorie = "douane"
s_applique_a = ["produit_importe", "colis_ecommerce"]
titre = "Droits de douane du tarif douanier commun sur les biens importés hors UE"
resume = "Les droits sont calculés en pourcentage de la valeur CIF (prix + transport + assurance) selon le code TARIC à 10 chiffres, puis la TVA française de 20 % s'ajoute. Exemples donnés par la douane : smartphones et ordinateurs portables 0 %, montres 4,5 %, vêtements en général 12 %. Pour les envois de 150 € ou moins, ce barème est remplacé jusqu'au 1er juillet 2028 par le droit forfaitaire de 3 € (voir eu_droit_forfaitaire_petits_colis)."
pour_projet = "Pour un stock importé de Chine, de Dubaï ou des USA (envois de plus de 150 €), il faut trouver le code TARIC de chaque produit avant de fixer le prix : sur des vêtements, 12 % de droits puis 20 % de TVA peuvent absorber une petite marge (préférences tarifaires éventuelles à vérifier pays par pays)."
as_of = 2026-11-28
date_regle = "Taux TARIC en vigueur au 28/11/2026 ; fiche douane mise à jour le 15/10/2026"
source = "https://www.douane.gouv.fr/fiche/calcul-des-droits-et-taxes-sur-les-achats-letranger"
preuve = "F"

[[dispositif]]
id = "eu_accord_ue_maroc"
pays = "UE"
sens = "facilite"
categorie = "douane"
s_applique_a = ["export_depuis_maroc", "artisanat", "produit_importe"]
titre = "Accord d'association UE–Maroc : produits industriels marocains sans droits de douane, sous preuve d'origine"
resume = "En vigueur depuis le 1er mars 2000, l'accord a entièrement libéralisé le commerce des produits industriels (l'artisanat non alimentaire en relève en principe) ; l'accord agricole complémentaire est en vigueur depuis octobre 2012. Le Maroc applique par anticipation les règles d'origine paneuroméditerranéennes dites transitoires : preuve par certificat EUR.1 visé par la douane marocaine ou par déclaration d'origine sur facture, que tout exportateur peut établir pour un envoi jusqu'à 6 000 € (au-delà, exportateur agréé), valable 10 mois. Selon la douane, la mention « REVISED RULES » est exigée à l'importation dans l'UE."
pour_projet = "Un artisan ou un exportateur de Fès peut faire entrer ses tapis, cuirs ou céramiques en France à 0 % de droits s'ils sont réellement d'origine marocaine et accompagnés d'une preuve d'origine correcte ; sans preuve, c'est le taux normal du tarif commun qui s'applique."
as_of = 2026-11-28
date_regle = "Accord en vigueur le 01/03/2000 ; accord agricole octobre 2012 ; fiche origine de la douane mise à jour le 06/11/2026"
source = "https://policy.trade.ec.europa.eu/eu-trade-relationships-country-and-region/countries-and-regions/morocco_en ; https://www.douane.gouv.fr/fiche/zone-pan-euro-mediterraneenne-et-cumul-diagonal-de-lorigine"
preuve = "F"

[[dispositif]]
id = "eu_droit_forfaitaire_petits_colis"
pays = "UE"
sens = "freine"
categorie = "douane"
s_applique_a = ["colis_ecommerce", "produit_importe"]
titre = "Fin de la franchise de 150 € : droit de douane forfaitaire de 3 € par catégorie d'article"
resume = "Appliqué depuis le 1er juillet 2026 (règlement (UE) 2026/382 du Conseil, sur accord ECOFIN du 12 décembre 2025) : les ventes à distance de 150 € ou moins venant de pays tiers paient 3 € par catégorie d'article (deux articles identiques comptent pour une seule catégorie), en plus de la TVA ; redevables : plateformes, vendeurs ou transporteurs. Mesure temporaire jusqu'au 1er juillet 2028, date où le centre de données douanier de l'UE devient obligatoire pour le e-commerce et où les droits normaux s'appliqueront. La taxe française de 2 € par article (article 82 de la loi de finances pour 2026), appliquée du 1er mars au 30 juin 2026, a été abrogée au 1er juillet 2026."
pour_projet = "Le dropshipping depuis la Chine ou les USA en petits colis coûte désormais au moins 3 € par type d'article (plus 2 € de frais de traitement depuis novembre), ce qui pénalise surtout les petits paniers composés d'articles différents."
as_of = 2026-11-28
date_regle = "Appliqué depuis le 01/07/2026, jusqu'au 01/07/2028 ; taxe française de 2 € abrogée le 01/07/2026"
source = "https://www.douane.gouv.fr/petits-colis-ce-qui-change-pour-vos-achats-en-ligne ; https://presse.economie.gouv.fr/?p=180373"
preuve = "F"

[[dispositif]]
id = "eu_frais_traitement_petits_colis"
pays = "UE"
sens = "freine"
categorie = "douane"
s_applique_a = ["colis_ecommerce", "export_depuis_maroc", "produit_importe"]
titre = "Frais de traitement européens de 2 € sur chaque colis de vente à distance importé"
resume = "Depuis le 1er novembre 2026, des frais de traitement de l'Union de 2 € s'appliquent aux importations de vente à distance destinées à des particuliers, sans seuil de valeur, en plus du droit de 3 € pour les envois de 150 € ou moins ; le montant est fixé par le règlement délégué (UE) 2026/2152. L'unité de calcul diffère selon les administrations : « par catégorie d'article » pour la douane française, « par article distinct » pour la douane irlandaise ; les frais ne sont pas remboursés en cas de retour."
pour_projet = "Un colis envoyé directement de Fès ou de Chine à un client français supporte ces 2 € même au-dessus de 150 €, ce qui renchérit la vente à l'unité ; un stock importé en une fois par l'entreprise française n'est pas une vente à distance et ne devrait pas être visé (à confirmer auprès de la douane)."
as_of = 2026-11-28
date_regle = "01/11/2026 (règlement délégué (UE) 2026/2152)"
source = "https://taxation-customs.ec.europa.eu/customs/eu-customs-reform_en ; https://www.revenue.ie/en/customs/individuals/union-handling-fee/index.aspx"
preuve = "F"

[[dispositif]]
id = "eu_tva_import_ioss"
pays = "UE"
sens = "facilite"
categorie = "fiscalite"
s_applique_a = ["colis_ecommerce", "export_depuis_maroc", "produit_importe"]
titre = "TVA due dès le premier euro à l'import et guichet IOSS pour les colis de 150 € ou moins"
resume = "Depuis le 1er juillet 2021, toute importation destinée à un consommateur de l'UE supporte la TVA du pays d'arrivée (20 % en France). Pour les ventes à distance de biens importés de 150 € ou moins, le vendeur peut s'inscrire à l'IOSS : il encaisse la TVA à la vente, la déclare et la reverse chaque mois dans un seul État, et l'importation est exonérée de TVA ; une entreprise sans établissement dans l'UE doit désigner un intermédiaire (établi en France pour le guichet français). Au-delà de 150 €, dédouanement classique avec TVA et droits."
pour_projet = "Une boutique en ligne qui expédie depuis Fès peut afficher des prix TTC et éviter au client français de payer TVA et frais à la livraison, mais elle doit rémunérer un intermédiaire IOSS dans l'UE, coût fixe à comparer au volume de ventes."
as_of = 2026-11-28
date_regle = "01/07/2021 ; page impots.gouv mise à jour le 22/03/2024"
source = "https://www.impots.gouv.fr/professionnel/suis-je-concerne-0 ; https://www.douane.gouv.fr/fiche/reglementation-sur-le-guichet-unique-de-tva-ou-ioss"
preuve = "F"

[[dispositif]]
id = "eu_plateforme_fournisseur_presume"
pays = "UE"
sens = "facilite"
categorie = "fiscalite"
s_applique_a = ["colis_ecommerce", "export_depuis_maroc", "produit_importe"]
titre = "Les places de marché paient elles-mêmes la TVA des ventes à distance qu'elles facilitent"
resume = "Depuis le 1er juillet 2021, une plateforme qui facilite par son interface une vente à distance à un consommateur de l'UE est « fournisseur présumé » : elle est réputée recevoir le bien du vendeur et le livrer au client, et doit déclarer et payer la TVA (guichet unique), notamment pour les biens importés en envois de 150 € ou moins. Les plateformes figurent aussi parmi les redevables du droit de 3 € et des frais de 2 € sur les petits colis, et assument la REP des vendeurs qui ne prouvent pas être en règle."
pour_projet = "Vendre depuis le Maroc via une grande place de marché évite à l'entrepreneur de gérer lui-même la TVA des petits colis importés, puisque la plateforme en est redevable."
as_of = 2026-11-28
date_regle = "01/07/2021 ; fiche « fournisseurs présumés » mise à jour le 06/11/2025"
source = "https://www.impots.gouv.fr/sites/default/files/media/3_Documentation/fiches_focus/nid_25432_guichet_unique_tva_fournisseurs_presumes_plateformes.pdf"
preuve = "F"

[[dispositif]]
id = "fr_vente_distance_obligations"
pays = "FR"
sens = "freine"
categorie = "reglementation"
s_applique_a = ["produit_importe", "colis_ecommerce", "export_depuis_maroc", "artisanat", "service_numerique"]
titre = "Vente en ligne aux particuliers : rétractation de 14 jours, bouton de rétractation, garantie de 2 ans, mentions obligatoires"
resume = "Le client a 14 jours pour se rétracter sans motif ; le vendeur doit fournir un formulaire type, une fonction gratuite de rétractation en ligne (obligatoire depuis le 19 juin 2026), un accusé de réception, et rembourser sous 14 jours ; sans information, le délai est prolongé de 12 mois. Il doit aussi afficher mentions légales (identité, SIREN, TVA, hébergeur) et CGV, livrer au plus tard 30 jours sans date annoncée, informer de la médiation, et assurer la garantie légale de conformité de 2 ans (défaut présumé antérieur pendant 24 mois), à la charge du vendeur et non du fabricant. Amendes jusqu'à 15 000 € (entreprise individuelle) pour défaut d'information sur la rétractation et 3 000 € pour les CGV."
pour_projet = "En dropshipping, c'est le vendeur qui doit reprendre, rembourser et gérer les pannes pendant 2 ans, même si le fournisseur chinois ou marocain ne coopère pas : il faut prévoir un budget retours."
as_of = 2026-11-28
date_regle = "Fonction de rétractation en ligne obligatoire depuis le 19/06/2026 (ordonnance n° 2026-2 et décret n° 2026-3 du 05/01/2026, références relevées dans des sources secondaires) ; fiches vérifiées le 19/06/2026 et le 17/08/2026"
source = "https://entreprendre.service-public.gouv.fr/vosdroits/F23455 ; https://www.service-public.gouv.fr/particuliers/vosdroits/F11094"
preuve = "F"

[[dispositif]]
id = "eu_securite_produits_gpsr_ce"
pays = "UE"
sens = "freine"
categorie = "reglementation"
s_applique_a = ["produit_importe", "colis_ecommerce", "export_depuis_maroc", "artisanat"]
titre = "Sécurité des produits : opérateur responsable établi dans l'UE (RSGP) et marquage CE pour certaines catégories"
resume = "Le règlement (UE) 2023/988 sur la sécurité générale des produits, applicable depuis le 13 décembre 2024, couvre les produits de consommation (vendus en ligne ou non, hors denrées alimentaires et médicaments notamment) et exige pour chaque produit un opérateur économique responsable établi dans l'UE : fabricant, importateur, mandataire ou prestataire d'exécution des commandes. Le marquage CE est en plus obligatoire pour les produits couverts par une législation harmonisée : jouets, drones, équipements électriques et électroniques, batteries, machines, équipements de protection individuelle, dispositifs médicaux, etc."
pour_projet = "Un vendeur installé à Fès qui livre directement des clients français doit avoir un responsable dans l'UE (sa micro-entreprise française peut être l'importateur) ; pour l'électronique ou les jouets achetés en Chine, sans marquage CE ni documentation la vente est illégale."
as_of = 2026-11-28
date_regle = "RSGP applicable depuis le 13/12/2024 ; page CE vérifiée le 17/07/2026"
source = "https://trade.ec.europa.eu/access-to-markets/fr/news/reglement-de-lue-sur-la-securite-generale-des-produits-rsgp-une-nouvelle-ere-de-protection-des ; https://europa.eu/youreurope/business/product-rules-compliance/general-product-compliance/ce-marking/index_fr.htm"
preuve = "F"

[[dispositif]]
id = "fr_rep_eco_contribution"
pays = "FR"
sens = "freine"
categorie = "reglementation"
s_applique_a = ["produit_importe", "colis_ecommerce", "export_depuis_maroc", "artisanat"]
titre = "Responsabilité élargie du producteur : éco-contribution et identifiant unique (emballages, électronique, textiles, meubles, jouets)"
resume = "Toute entreprise qui met sur le marché français des produits d'une filière REP (emballages, équipements électriques et électroniques, textiles, ameublement, piles, jouets, articles de sport et loisirs, bricolage et jardin, etc.) doit adhérer à un éco-organisme ou à un système individuel, payer l'éco-contribution, obtenir un identifiant unique ADEME par filière et l'afficher dans ses CGV et sur son site ; logo Triman obligatoire. Depuis le 1er janvier 2022, les plateformes de vente à distance assument la REP des vendeurs qui ne prouvent pas être en règle. Sanctions : jusqu'à 7 500 € par unité ou tonne, astreinte jusqu'à 20 000 € par jour, amende jusqu'à 30 000 € pour les manquements au registre."
pour_projet = "Importer et vendre en France des vêtements, de la décoration, des luminaires ou des gadgets électroniques impose au minimum l'adhésion à l'éco-organisme des emballages et à celui de la filière du produit, avec déclarations annuelles même pour de petits volumes."
as_of = 2026-11-28
date_regle = "Obligation des plateformes depuis le 01/01/2022 ; page du ministère mise à jour le 11/11/2026"
source = "https://www.ecologie.gouv.fr/cadre-general-des-filieres-responsabilite-elargie-des-producteurs ; https://filieres-rep.ademe.fr/en/identifiant-unique"
preuve = "F"

[[dispositif]]
id = "fr_contrefacon"
pays = "FR"
sens = "freine"
categorie = "douane"
s_applique_a = ["produit_importe", "colis_ecommerce", "concept_franchise"]
titre = "Contrefaçon : saisie en douane et délit douanier, en plus des sanctions de propriété intellectuelle"
resume = "Importer des marchandises contrefaisantes est un délit douanier : dans la rédaction de l'article 414 du code des douanes en vigueur jusqu'au 30 avril 2026, jusqu'à 3 ans de prison, confiscation des marchandises et des moyens de transport, amende d'une à deux fois leur valeur, et jusqu'à 10 ans et 10 fois la valeur en bande organisée. Le code des douanes a été recodifié à droit constant au 1er mai 2026 (ordonnance n° 2026-265 du 8 avril 2026, nouvelle numérotation) ; ces sanctions se cumulent avec celles du code de la propriété intellectuelle."
pour_projet = "Avant d'importer un produit ou un concept à la mode repéré aux USA, à Dubaï ou en Chine, il faut vérifier qu'il ne reprend pas une marque, un dessin ou un modèle protégé en France ou dans l'UE : un seul lot saisi peut faire perdre tout le capital de départ."
as_of = 2026-11-28
date_regle = "Nouveau code des douanes en vigueur le 01/05/2026 ; ancien article 414 en vigueur du 20/07/2023 au 30/04/2026"
source = "https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000047861217 ; https://www.douane.gouv.fr/actualites/recodification-le-code-des-douanes-entrera-en-vigueur-le-1er-mai-2026"
preuve = "F"

[[dispositif]]
id = "fr_franchise_loi_doubin"
pays = "FR"
sens = "facilite"
categorie = "reglementation"
s_applique_a = ["concept_franchise"]
titre = "Franchise : document d'information précontractuelle remis au moins 20 jours avant la signature (loi Doubin)"
resume = "Le franchiseur doit remettre au candidat un document d'information précontractuelle (DIP) et le projet de contrat au moins 20 jours avant la signature, pour une décision en connaissance de cause (article L330-3 du code de commerce) ; le contenu du DIP est fixé par l'article R330-1. Selon la Cour de cassation, le non-respect peut entraîner la nullité du contrat s'il a vicié le consentement du franchisé."
pour_projet = "Pour reprendre en France un concept américain ou dubaïote sous contrat, l'entrepreneur dispose de 20 jours pour analyser le DIP (et devra en remettre un lui-même s'il recrute des franchisés) ; il faut vérifier que droit d'entrée et redevances sont compatibles avec moins de 2 000 € de capital."
as_of = 2026-11-28
date_regle = "Article L330-3 du code de commerce ; fiche vérifiée le 20/07/2023"
source = "https://entreprendre.service-public.gouv.fr/vosdroits/F37343"
preuve = "F"

