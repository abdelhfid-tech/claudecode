titre = "Artisanat : Registre national (loi 50-17), carte professionnelle et salons export pris en charge par la Maison de l'Artisan"
resume = "L'inscription au Registre national de l'artisanat donne une carte professionnelle numérique valable 5 ans, qui ouvre l'accès aux formations, aux salons nationaux et internationaux, aux programmes d'appui de l'État et à l'AMO. Pour les exposants sélectionnés, la Maison de l'Artisan paie l'inscription, un stand de 12 m² au plus et le transport de 250 kg de produits (exemple : INDEX Dubaï, 28 au 30 septembre 2026), sur attestation RNA et ICE pour coopératives et entreprises ; seuls des produits artisanaux marocains, ni importés ni contrefaits, peuvent être exposés."
pour_fes = "Un revendeur qui n'est pas artisan doit travailler avec des artisans ou coopératives de Fès inscrits au RNA, ou créer une entreprise artisanale, pour profiter des salons pris en charge."
