# Relevé « assortiment » : pour un commerce de maison, cadeau et enfant à Fès, chaque concept est
# cherché sur Google à Fès, à Casablanca et au Maroc (autocomplétion), en français et en arabe.
# Il dit ce qui est déjà demandé à Fès, ce qui est en avance à Casablanca, ce qui se cherche
# partout sans lieu (à vendre en ligne) et ce que presque personne ne cherche.
#
# Ce relevé ne voit pas les achats d'impulsion (confiserie, petits cadeaux) : on ne les cherche
# pas sur Google, on les achète en les voyant. Pour ces familles, la caisse juge, pas le radar.
#
# La liste ci-dessous est un exemple. Un commerçant met la sienne dans <espace>/config/assortiment.toml
# (elle reste sur le serveur, hors du dépôt public).

city = "fes"
leader = "casablanca"
national = { fr = "maroc", ar = "المغرب", match = "\\b(maroc|morocco)\\b|المغرب" }
city_ar = { fes = "فاس", casablanca = "الدار البيضاء" }
city_ar_match = { fes = "فاس", casablanca = "الدار البيضاء|كازا" }

# Comment on cherche à acheter : précisions repérées dans les suggestions.
[intents]
prix = "\\b(prix|pas cher|promo|promotion|solde)\\b|ثمن|بثمن|اثمنة"
magasin = "\\b(magasin|boutique|adresse|ou acheter|showroom|marche)\\b|محل|محلات"
en_ligne = "\\b(livraison|en ligne|jumia|site|instagram|facebook|whatsapp|commande)\\b|توصيل"
gros = "\\b(gros|grossiste|derb omar|fournisseur|fabricant|usine)\\b|الجملة|بالجملة"
personnalise = "\\b(personnalise|personnalisee|prenom|gravure|brode|broderie)\\b"
cadeau = "\\b(cadeau|coffret|box|offrir)\\b|هدية|هدايا"

