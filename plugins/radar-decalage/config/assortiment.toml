# Écosystème local : qui peut acheter en volume, fournir ou relayer, cherché à Fès.
[[ecosysteme]]
role = "Clients professionnels"
termes = ["riad", "maison d'hote", "spa", "hammam", "clinique", "creche", "ecole privee", "salle des fetes",
          "negafa", "traiteur", "wedding planner", "cadeau entreprise", "salle de sport"]

[[ecosysteme]]
role = "Fournisseurs et artisans"
termes = ["grossiste", "cooperative", "poterie", "zellige", "dinanderie", "babouche", "broderie", "maroquinerie",
          "tissage", "savon artisanal", "artisan"]

[[ecosysteme]]
