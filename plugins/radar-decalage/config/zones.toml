# Zones suivies. Valeurs par défaut du plugin ; un fichier workspace/config/zones.toml
# du même format remplace cette liste (la clé « zone » est une liste, elle n'est pas fusionnée).
#
# group : origine (USA), sentinelle (marché qui reçoit tôt), test (marché-test des plateformes),
#         cible (France, Maroc, francophonie), relais (Golfe, Égypte : apps arabophones)
# apple : code de vitrine App Store
# play  : code pays Google Play ; hl : langue d'affichage

[[zone]]
code = "US"
name = "États-Unis"
group = "origine"
apple = "us"
play = "us"
hl = "en"

