# Archétypes d'initiatives et paramètres de pays (grille de rendement, dossier initiatives-economie, section 8).
# Valeurs = hypothèses datées du 2026-11-28, ancrées sur les taux de base publiés ; à recalibrer avec le journal des initiatives.
#
# hrun : heures par mois d'exploitation (M7 à M24) ; p12 : probabilité d'atteindre 1 000 €/mois net à M12 ;
# Rs : revenu mensuel médian des cas réussis à M12 (€) ; m : marge brute ; T1 : semaines jusqu'au premier revenu ;
# C : capital sur 6 mois (€) ; h : heures de fondateur sur 6 mois ; L : levier de Claude Code (0-1) ;
# D : défendabilité (0-5) ; Rp : risque de plateforme ou réglementaire ; orient : export ou local ;
# rails : rails de paiement acceptables (config/rules/payments.toml) ; regime : statut fiscal.

