# Délais a priori d'arrivée, en jours après l'arrivée dans le pays d'origine,
# par classe de friction et groupe de pays : médiane, P10, P90 (dossier méthode, tableau 7.2).
# Ce sont des ESTIMATIONS calées sur une douzaine de cas, à recalibrer par le backtest.
#
# p_never : part « n'arrive jamais ». Seules B (0,05, nécessaire pour reproduire le contrôle
# Labubu du dossier) et D en UE (0,35) viennent du dossier ; les autres valeurs sont des
# hypothèses [H] marquées comme telles.
# p90 = 0 signifie « pas de borne haute connue » (∞ dans le dossier) : P90 pris à 10 ans.
# blocked = true : bloqué tant que la porte de paiement est fermée (classe F au Maghreb).

as_of = 2026-11-28
source = "docs/etude/diffusion-scoring.md, section 7.2 ; contre-vérification"
sentinel_rho = 0.5   # poids de la mise à jour par pays sentinelle [H]

[groups]
UE_FR = ["FR", "BE", "CH", "LU"]
QC = ["CA-QC"]
MAGHREB = ["MA", "DZ", "TN"]
ASS = ["SN", "CI", "CM", "CD"]

[class.A]
label = "contenu, mème, son, sortie mondiale"
p_never = 0.0
p_never_evidence = "H"
UE_FR = { median = 7, p10 = 0, p90 = 30 }
QC = { median = 5, p10 = 0, p90 = 21 }
MAGHREB = { median = 14, p10 = 0, p90 = 60 }
ASS = { median = 21, p10 = 0, p90 = 90, evidence = "H" }

[class.B]
label = "produit ou application sans verrou"
p_never = 0.05
p_never_evidence = "E"
UE_FR = { median = 75, p10 = 20, p90 = 240 }
QC = { median = 45, p10 = 10, p90 = 180 }
MAGHREB = { median = 180, p10 = 45, p90 = 720 }
ASS = { median = 270, p10 = 60, p90 = 1080, evidence = "H" }

[class.C]
label = "fonctionnalité de plateforme, paiement"
p_never = 0.10
p_never_evidence = "H"
UE_FR = { median = 300, p10 = 150, p90 = 600 }
QC = { median = 120, p10 = 0, p90 = 450 }
MAGHREB = { median = 900, p10 = 0, p90 = 3300 }
ASS = { median = 1100, p10 = 0, p90 = 3650 }

[class.D]
label = "produit réglementé"
p_never = 0.35
p_never_evidence = "E"
UE_FR = { median = 1100, p10 = 700, p90 = 1825 }
QC = { median = 900, p10 = 365, p90 = 1825 }
MAGHREB = { median = 1825, p10 = 900, p90 = 0 }
ASS = { median = 1825, p10 = 900, p90 = 0 }

[class.E]
label = "pratique à infrastructure physique"
p_never = 0.10
p_never_evidence = "H"
UE_FR = { median = 1200, p10 = 700, p90 = 2100 }
QC = { median = 900, p10 = 400, p90 = 1800 }
MAGHREB = { median = 1700, p10 = 900, p90 = 3000 }
ASS = { median = 2200, p10 = 1000, p90 = 0 }

[class.F]
label = "modèle d'affaires dépendant des rails de paiement"
p_never = 0.15
p_never_evidence = "H"
UE_FR = { median = 1500, p10 = 1000, p90 = 2600 }
QC = { median = 900, p10 = 400, p90 = 1800 }
MAGHREB = { blocked = true }
ASS = { blocked = true }
